include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Freezed puts @JsonKey on constructor parameters.
    invalid_annotation_target: ignore
  exclude:
    - build/**
    - "**/*.freezed.dart"
    - "**/*.g.dart"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - directives_ordering
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
